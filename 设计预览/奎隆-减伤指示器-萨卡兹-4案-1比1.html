<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>伤害减免指示器 · 萨卡兹视觉 · 4 案</title>
<style>
  html,body{margin:0;background:#08080b;font-family:"HarmonyOS Sans SC","Microsoft YaHei",sans-serif}
  #root{width:1280px;height:1440px;position:relative}
  .page{position:absolute;width:1280px;height:720px;transform:scale(.5);transform-origin:0 0;
        background:radial-gradient(ellipse at 50% 40%, #15151c 0%, #0b0b10 62%, #07070a 100%);overflow:hidden}
  .frame{position:absolute;inset:0;border:1px solid #1e1e26;z-index:98;pointer-events:none}
  .tag{position:absolute;left:16px;top:14px;z-index:99;color:#c8a24a;font:14px monospace;
       background:rgba(0,0,0,.6);padding:4px 10px;border-left:3px solid #7d1710}
  /* 敌人牌 */
  .plate{position:absolute;left:994px;top:160px;width:272px;height:264px;
         background:#141519;border:1px solid #2a2b30}
  .plate::before{content:'';position:absolute;left:-1px;top:-1px;width:16px;height:16px;background:#fff44f;
                 clip-path:polygon(0 0,100% 0,0 100%)}
  .pname{position:absolute;left:994px;top:436px;color:#ff625d;font-size:17px}
  .pbar {position:absolute;left:994px;top:472px;width:272px;height:16px;background:#c04030}
  .pnum {position:absolute;left:994px;top:486px;color:#efe7d8;font:20px "Space Grotesk",monospace}
  .plab {position:absolute;left:1266px;top:492px;transform:translateX(-100%);color:#6f6f7a;font:10px sans-serif}
  /* 指示器容器 */
  .ind{position:absolute;left:994px;top:504px;width:272px;height:96px}
  .art{display:block}
  .big{font:700 34px "Space Grotesk",monospace;dominant-baseline:auto}
  /* ---- 动效（都克制 ✓ 不用发光球 ✗）---- */
  @keyframes breathe{0%,100%{opacity:.62}50%{opacity:1}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.045);opacity:1}}
  @keyframes dash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-120}}
  @keyframes seg{0%,6%{opacity:.18}18%,100%{opacity:1}}
  @keyframes pop{0%{transform:scale(1)}5%{transform:scale(1.16)}15%{transform:scale(1)}100%{transform:scale(1)}}
  @keyframes hitpulse{0%{opacity:0}3%{opacity:1}15%{opacity:0}100%{opacity:0}}
  .pulse{transform-origin:48px 48px;animation:pulse 3.2s ease-in-out infinite}
  .veins path{stroke-dasharray:5 4;animation:dash 6s linear infinite}
  .seg{animation:seg 3s ease-out infinite}
  .stageT{animation:breathe 3.2s ease-in-out infinite}
  .big{transform-origin:center;animation:pop 3.2s ease-out infinite}
  .hit{position:absolute;left:994px;top:498px;width:272px;height:104px;pointer-events:none;
       background:radial-gradient(ellipse at 50% 50%, rgba(226,35,26,.55), transparent 72%);
       opacity:0;animation:hitpulse 3s ease-out infinite}
</style></head><body>
