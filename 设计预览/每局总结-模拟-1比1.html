function stats(d) {
  var ok = 0, combo = 0, maxc = 0, byQuiz = {}, byEnemy = {};
  d.answers.forEach(function (a) {
    if (a.ok) { ok++; combo++; if (combo > maxc) maxc = combo; } else { combo = 0; }
    var q = a.quiz === 'anagram' ? 'anagram' : (a.quiz === 'rail' ? 'rail' : '');
    if (!byQuiz[q]) byQuiz[q] = { n:0, ok:0 }; byQuiz[q].n++; if (a.ok) byQuiz[q].ok++;
    if (!byEnemy[a.enemy]) byEnemy[a.enemy] = { n:0, ok:0, f:a.floor, words:[] };
    byEnemy[a.enemy].n++; if (a.ok) { byEnemy[a.enemy].ok++; byEnemy[a.enemy].words.push(a.word); }
  });
  return { ok:ok, bad:d.answers.length - ok, rate:Math.round(ok / Math.max(1, d.answers.length) * 100), max:maxc, byQuiz:byQuiz, byEnemy:byEnemy };
}
function div(cls, text, css) {

function at(node, l, t, w, h) {

  if (w != null) node.style.width = w + 'px';
  if (h != null) node.style.height = h + 'px';

}

/* 可滚动区：返回一个 DocumentFragment（视口 + 滚动条）
   build(inner) 需返回内容总高 ✓（子元素都是绝对定位 → scrollHeight 读不到 ✗） */
function scroller(left, top, w, h, build) {
  var frag = document.createDocumentFragment();
  var vp = div('vp'); at(vp, left, top, w, h);
  var inner = div(''); inner.style.position = 'absolute'; inner.style.left = '0'; inner.style.top = '0'; inner.style.width = w + 'px';
  var total = build(inner) || 0;
  inner.style.height = total + 'px';
  vp.appendChild(inner);
  var pp = div('pp'); at(pp, left + w + 14, top, 1, h);
  var th = div('th'); at(th, left + w + 12, top, 5, 40);
  var off = 0;
  function apply() {
    if (total <= h) { th.style.display = 'none'; return; }
    th.style.display = '';
    var thh = Math.max(28, Math.round(h * h / total));
    th.style.height = thh + 'px';
    off = Math.max(0, Math.min(total - h, off));
    inner.style.transform = 'translateY(' + (-off) + 'px)';
    th.style.top = (top + Math.round((h - thh) * (off / (total - h)))) + 'px';
  }
  vp.addEventListener('wheel', function (e) { e.preventDefault(); off += e.deltaY; apply(); }, { passive:false });
  frag.appendChild(vp); frag.appendChild(pp); frag.appendChild(th);
  setTimeout(apply, 0);
  return frag;
}

function render() {
  ST = stats(D);

  makers.forEach(function (mk, i) {
    var s = div('', null, 'position:absolute;left:0;top:0;width:1280px;height:720px;display:' + (i === cur ? 'block' : 'none'));
    s.appendChild(mk());

  });
  var box = at(div('', null, 'display:flex;gap:8px'), 44, 666);
  NAMES.forEach(function (nm, i) {
    var d = div('pg' + (i === cur ? ' on' : ''), String(i + 1));
    d.style.position = 'relative';
    d.onclick = function () { cur = i; render(); };
    box.appendChild(d);
  });
  stage.appendChild(box);
  stage.appendChild(at(div('small', NAMES[cur]), 44 + 5 * 42 + 10, 673));

}
document.querySelectorAll('#bar button').forEach(function (b) {

    b.className = 'on';
    D = DATA[b.getAttribute('data-v')] || DATA.win;
    cur = 0; render();
  };
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') { cur = Math.min(4, cur + 1); render(); }
  if (e.key === 'ArrowLeft') { cur = Math.max(0, cur - 1); render(); }
});
render();
