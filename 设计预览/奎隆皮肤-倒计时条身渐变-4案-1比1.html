<title>巴别残响 · 奎隆皮肤 · 倒计时条身渐变 4 案（1:1 预览）</title>
<style>
:root{--ink:#E8E8EE;--silver:#B8B8C8;--dim:#7E7E92;--bronze:#9C846C;--bronzeHi:#B4B49C;
      --verm:#CC543C;--uiRed:#C01D22;--stage:#FF4F08;--deep:#181828;--stoneL:#404040}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#101014;color:var(--ink);font-family:'HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
     display:flex;flex-direction:column;align-items:center;padding:14px 0 40px}
h1{font-size:14px;font-weight:500;letter-spacing:.06em;color:var(--silver);margin-bottom:4px}
h1 small{color:var(--dim);font-weight:400}
#bar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center;max-width:1120px}
.tab{padding:7px 14px;border:1px solid #33333d;background:#16161c;color:var(--silver);cursor:pointer;
     font-size:12.5px;font-family:inherit}
.tab:hover{border-color:var(--verm);color:#fff}
.tab.on{background:#221418;border-color:var(--verm);color:#fff}
#ctrls{display:flex;gap:18px;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--silver);flex-wrap:wrap}
input[type=range]{width:230px}
#stage{position:relative;width:1090px;height:613px;overflow:hidden;background:#0b0b10;border:1px solid #2a2a34}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
#lotus{position:absolute;z-index:1;pointer-events:none;opacity:.42}
#ui{position:absolute;inset:0;z-index:40}
#ui div{position:absolute;white-space:nowrap}
#pill{background:var(--uiRed);color:#F4F4F8;display:flex;align-items:center;justify-content:center;letter-spacing:1.5px}
#badge{color:var(--verm);text-align:center;letter-spacing:3px}
#word{color:#E8E8EE;font-family:'Gilroy','Space Grotesk',sans-serif;font-weight:300;text-align:center}
#cardrule{height:1px;background:rgba(156,132,108,.85)}
#hint{color:var(--bronze)}
#cdlab{color:var(--silver)}
#cdwrap{background:rgba(24,24,40,.92);border:1px solid var(--stoneL);overflow:hidden}
#cdfill{position:absolute;left:1px;top:1px;bottom:1px;background-repeat:no-repeat;background-size:100% 100%}
#cdnum{font-family:'Space Grotesk',monospace;text-align:right;font-weight:700;color:#F2EFE4}
.opt{position:absolute;height:72px}
.opt .t{position:absolute;left:0;color:#E8E8EE}
.opt .k{position:absolute;right:0;color:var(--dim);font-family:'Space Grotesk',monospace}
.opt .ln{position:absolute;left:0;bottom:0;height:1px;background:rgba(156,132,108,.5)}
.opt.ok .ln{background:var(--verm);height:2px}
.opt.ok .t{color:#fff}
#note{width:1090px;margin-top:14px;font-size:12.5px;line-height:1.85;color:var(--dim)}
#note b{color:var(--silver);font-weight:500}
#note .k{color:var(--bronzeHi);font-family:'Space Grotesk',monospace}
#strips{width:1090px;margin-top:14px}
#strips canvas{display:block;border:1px solid #2a2a34;margin-bottom:10px}
</style></head><body>

function sample(stops, t) {
  var pts = stops.slice().sort(function (a, b) { return a[0] - b[0]; });
  for (var i = 0; i < pts.length - 1; i++) {
    var t0 = pts[i][0], c0 = pts[i][1], t1 = pts[i + 1][0], c1 = pts[i + 1][1];
    if (t >= t0 && t <= t1) {
